.bp,.gp{display:inline-grid;place-items:center;width:18px;height:18px;flex:none;font-family:var(--px);font-size:7px;font-style:normal;color:#06210f}
.bp{background:var(--lime);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.bp::after{content:"B"}

.gp::after{content:"G"}
#app{max-width:1240px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding-block:10px;background:linear-gradient(180deg,rgba(7,16,41,.97),rgba(7,16,41,.88));border-bottom:2px solid rgba(47,211,194,.25)}
.prof{display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.prof img{width:48px;height:48px;border:2px solid var(--gold);background:var(--panel)}
.prof b{display:block;font-size:22px;font-weight:400;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.lvrow{display:flex;align-items:center;gap:6px;margin-top:4px;font-family:var(--px);font-size:9px;color:var(--muted)}

.quick{display:flex;gap:4px}

.quick .ic{width:26px;height:26px}
.dot{position:absolute;top:0;right:4px;width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--ink)}
.wallet{margin-left:auto;display:flex;gap:10px;align-items:center}
.cur{display:flex;align-items:center;gap:8px;font-family:var(--px);font-size:11px;padding:6px 8px;background:rgba(15,33,72,.7);border:2px solid var(--line);white-space:nowrap}

#view{flex:1;padding-block:16px 108px;display:flex;flex-direction:column;gap:16px;min-width:0}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,#0d1d40,#081430);border-top:2px solid rgba(47,211,194,.35);padding:0 0 env(safe-area-inset-bottom,0px)}
#nav .in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
#nav button{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 4px;font-size:22px;color:var(--cream);position:relative;border-left:1px solid rgba(142,166,214,.15)}
#nav button:first-child{border-left:0}

#nav button.on{background:linear-gradient(180deg,rgba(47,211,194,.25),rgba(47,211,194,.05));color:var(--lime)}
#nav button.on::before{content:"";position:absolute;left:0;right:0;top:-2px;height:3px;background:var(--lime)}
#nav .dot{top:10px;right:16%}
.subhead{display:flex;align-items:center;gap:14px}
.subhead .back{width:52px;height:52px;border-radius:50%;background:rgba(142,166,214,.18);display:grid;place-items:center;font-family:var(--px);font-size:20px;flex:none}
.subhead h1{margin:0;font-weight:400;font-size:38px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subhead .sh-r{display:flex;gap:16px;align-items:center}
.subhead .sh-r button .ic{width:30px;height:30px}
.panel{background:linear-gradient(180deg,rgba(22,48,106,.85),rgba(15,33,72,.92));border:2px solid rgba(47,211,194,.45);box-shadow:0 0 0 1px rgba(0,0,0,.4),6px 6px 0 var(--shadow)}
.pad16{padding:16px}
.h{font-family:var(--px);font-size:10px;color:var(--muted);letter-spacing:1px;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--lime);color:#0d1a02;padding:12px 18px;font-size:20px;border-radius:999px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--shadow);transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn.gold{background:linear-gradient(180deg,#ffe58a,var(--gold) 55%,#e6a800);color:#2a1a00}
.btn.teal{background:var(--teal);color:#032421}
.btn.pink{background:var(--pink);color:#2a0710}

.btn.sm{padding:7px 12px;font-size:16px}
.btn.wide{width:100%}
.btn[disabled]{filter:grayscale(1) brightness(.55);cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.home{display:grid;grid-template-columns:104px minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto auto;gap:16px}
.side{grid-row:1/3;display:flex;flex-direction:column;gap:14px}
.sq{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;background:linear-gradient(160deg,#2b4f86,#14294f);border:2px solid rgba(255,255,255,.18);box-shadow:4px 4px 0 var(--shadow)}
.sq .ic{width:34px;height:34px;color:#bfe9ff}
.sq .dot{top:-4px;right:-4px;width:14px;height:14px}
.banner{position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.25);box-shadow:6px 6px 0 var(--shadow);min-height:330px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .4s steps(4);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:18px;gap:12px;text-align:center}
.slide.on{opacity:1;z-index:1}
.slide .art{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.slide .art img{height:86%;image-rendering:pixelated;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.45))}
.slide .art img.side{height:70%;margin-inline:-40px;opacity:.85}
.slide .tt{position:relative;font-size:44px;line-height:1;text-shadow:3px 3px 0 var(--shadow);background:rgba(2,7,19,.55);padding:6px 16px}
.slide .sst{position:relative;font-size:17px;color:var(--cream);text-shadow:2px 2px 0 var(--shadow)}

.dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}

.dots button.on{background:#fff}
.burst{background:repeating-conic-gradient(from 0deg at 50% 70%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 14deg),linear-gradient(160deg,var(--b1),var(--b2))}
.ev{position:relative;overflow:hidden;min-height:200px;padding:22px;display:flex;flex-direction:column;gap:8px;text-align:left;border:2px solid rgba(255,255,255,.25);box-shadow:6px 6px 0 var(--shadow);background:repeating-linear-gradient(135deg,transparent 0 18px,rgba(255,77,109,.08) 18px 36px),linear-gradient(120deg,#16123a,#311047 60%,#5a0f2e)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{position:relative;overflow:hidden;min-height:150px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;border:2px solid rgba(255,255,255,.3);box-shadow:5px 5px 0 var(--shadow)}
.tile b{font-size:32px;font-weight:400;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.tile.team{background:linear-gradient(120deg,#1d3a78 0 55%,#122752 55%)}
.tile.play{background:linear-gradient(120deg,#d9ff3d,#5ad66b 65%,#159c7a);color:#06210f}
.tile.play b{text-shadow:none}
.tile .emb{position:absolute;right:14px;bottom:14px;width:64px;height:64px}
.tile .bigball{position:absolute;right:-16px;bottom:-16px;width:110px;height:110px;color:#e2661a;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.35))}
.shield{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:84px;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);background:linear-gradient(180deg,#2a5bb8,#163a7a);box-shadow:inset 0 0 0 4px var(--gold);color:#fff;padding-bottom:10px}
.shield small{font-family:var(--px);font-size:7px;opacity:.85}
.shield b{font-family:var(--px);font-size:22px;font-weight:400;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.card{--rc:#b9c0cc;--rc2:#5d6574;--tx:#160d1f;--pb:#160d1f;position:relative;width:100%;aspect-ratio:3/4.1;font-size:10px;background:linear-gradient(160deg,var(--rc) 0 55%,var(--rc2) 55% 100%);clip-path:polygon(10% 0,90% 0,100% 7%,100% 93%,90% 100%,10% 100%,0 93%,0 7%);display:flex;flex-direction:column;align-items:center;color:var(--tx);padding:.7em .5em .6em;box-shadow:inset 0 0 0 .35em rgba(0,0,0,.18);user-select:none;overflow:hidden;isolation:isolate}
.card::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
.card.k-normal{--rc:#c3c9d3;--rc2:#6b7383}
.card.k-normal::after{background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 6px)}
.card.k-lunch{--rc:#ffd27a;--rc2:#ff7a2f}

.card.k-lunchS::after{background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.55),transparent 45%),repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,255,255,.18) 0 8deg,transparent 8deg 20deg)}
.card.k-tots{--rc:#4f8dff;--rc2:#102a66;--tx:#fff;--pb:#ffd23f}

.card.k-totsS::after{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%) -150% 0/200% 100% no-repeat,radial-gradient(circle at 50% 38%,rgba(255,210,63,.45),transparent 50%);animation:sheen 2.6s steps(10) infinite}
.card.k-totsS .c-pos{color:#0a1a4a}
.card.k-rep{--rc:#3a0a14;--rc2:#0c0205;--tx:#ffe9a8;--pb:#ffd23f;box-shadow:inset 0 0 0 .3em #ffd23f,inset 0 0 0 .55em #7a0f24,inset 0 0 0 .7em #ffd23f;background:linear-gradient(160deg,#7a0f24 0 30%,#2a0610 30% 62%,#0c0205 62%)}

function buildDB(){
  const used=new Set(ROSTER.flatMap(x=>x[3]));
  const r=mulberry(2026);
  for(let n=0;n<100;n++){
    const pos=SLOTS[n%5];const ovr=Math.round(40+r()*50);const hr=HEIGHT[pos];
    DB.push({id:'p'+String(n).padStart(3,'0'),name:genName(r,used),pos,cls:'normal',special:false,ovr,num:1+Math.floor(r()*55),
      height:Math.round(hr[0]+r()*(hr[1]-hr[0])),look:genLook(r),q:0,stats:null});
    const P0=DB[DB.length-1];P0.q=Math.min(0.3,qualityOf(P0.name));P0.grade=gradeOf(P0.q);P0.stats=genStats(pos,ovr,r,P0.q);
  }
  ROSTER.forEach(([cls,ovr,special,names])=>names.forEach((name,i)=>{
    const pos=(cls==='fr'&&FR_POS[name])||PERSON_POS[name]||POS[Math.floor(hash01(name+'|pos')*3)];const pr=mulberry(hashInt(name));const look=genLook(pr);const num=1+Math.floor(pr()*55);const hr=HEIGHT[pos];const height0=Math.round(hr[0]+pr()*(hr[1]-hr[0]));
    const q=qualityOf(name);const height=PERSON_INFO[name]?PERSON_INFO[name][0]:height0;DB.push({id:`${cls}${ovr}_${i}`,name,pos,cls,special,ovr,num,height,look,q,grade:gradeOf(q),stats:traitStats(name,ovr,tiltStats(name+'|'+cls,ovr,genStats(pos,ovr,mulberry(hashInt(name+'s'+cls)),q)))});
  }));
  const ownMax=k=>DB.some(q=>{const t=PERSON_TRAIT[q.name];return t&&t.maxStat&&t.maxStat.includes(k)});
  for(const p of DB){const t=PERSON_TRAIT[p.name];for(const k of ['reb','ins','str','def'])if(ownMax(k)&&!(t&&t.maxStat&&t.maxStat.includes(k)))p.stats[k]=Math.min(p.stats[k],statCap(p.ovr)-3)}
  const byName={};for(const p of DB){p.iq=Math.max(0,Math.min(1,(p.ovr-40)/100));(byName[p.name]=byName[p.name]||[]).push(p)}
  for(const n in byName){const l=byName[n];const os=[...new Set(l.map(p=>p.ovr))].sort((a,b)=>a-b);if(os.length<2)continue;for(const p of l)p.iq+=os.indexOf(p.ovr)/(os.length-1)*0.25}
  for(const p of DB){if(!fastOf(p.name))p.stats.spd=Math.max(1,p.stats.spd-Math.max(1,Math.round(statCap(p.ovr)*SPD_CUT/100)));DBI[p.id]=p}
}

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function mkEnsure(){if(!S.mk||!S.mk.f){S.mk={t:Math.floor(Date.now()/60000)*60000,day:today(),f:{},pf:{},lo:{},hi:{}};mkTick(1)}S.mk.lo=S.mk.lo||{};S.mk.hi=S.mk.hi||{}}
function mkTick(n){
  mkEnsure();
  for(const p of DB){let f=S.mk.f[p.id]??(0.9+0.2*hash01(p.id)),pf=f;const vol=p.cls==='rep'?0.02:p.cls==='normal'?0.05:0.035;
    for(let k=0;k<n;k++){pf=f;f*=1+gauss()*vol;f+=(1-f)*0.04;f=clamp(f,0.6,1.6)}
    f=Math.round(f*1e4)/1e4;S.mk.pf[p.id]=Math.round(pf*1e4)/1e4;S.mk.f[p.id]=f;
    S.mk.lo[p.id]=Math.min(S.mk.lo[p.id]??f,f);S.mk.hi[p.id]=Math.max(S.mk.hi[p.id]??f,f);}
}
function mkUpdate(){mkEnsure();const due=Math.floor((Date.now()-S.mk.t)/60000);if(due>0){if(S.mk.day!==today()){S.mk.day=today();S.mk.lo={};S.mk.hi={}}mkTick(Math.min(due,120));S.mk.t+=due*60000;save();return true}return false}

const mkDelta=id=>{if(fixedPrice(id))return 0;const f=dayF(id),pf=S.mk.pf[id]??f;return f/pf-1};
function deltaHTML(id){const d=mkDelta(id);if(Math.abs(d)<0.0005)return '<span class="dl">-</span>';return `<span class="dl ${d>0?'up':'down'}">${d>0?'▲':'▼'}${Math.abs(d*100).toFixed(1)}%</span>`}

  const mid=cur*(1+(r()-0.5)*0.05);const cf={normal:1,lunch:0.9,tots:0.8,rep:0.035}[p.cls]??0.8;const cb={normal:1,lunch:0.9,tots:0.85,rep:0.3}[p.cls]??0.8;

function processOrders(){
  const wNow=mkWin();const w0=S.lastW||wNow;S.lastW=wNow;if(w0>=wNow)return;
  if(!S.bids.some(b=>b.qty>0)&&!S.listings.some(l=>!l.dur&&!l.done))return;
  const bought=[],sold=[];let inc=0;
  for(let w=Math.max(w0+1,wNow-ORDER_CATCHUP);w<=wNow;w++){
    const used={},usedB={};
    for(const b of S.bids.filter(x=>x.qty>0).sort((x,y)=>y.price-x.price)){
      const p=DBI[b.pid];const key=p.id+'@'+b.evo;
      let asks=bookAt(p,b.evo,w).asks;asks=takeFrom(asks,w===wNow?S.taken[key]:null,w);asks=takeFrom(asks,used[key]?{w,n:used[key]}:null,w);
      for(const a of asks){while(b.qty>0&&a.qty>0&&a.price<=b.price){a.qty--;b.qty--;used[key]=(used[key]||0)+1;S.gp+=b.price-a.price;b.got=(b.got||0)+1;S.trades.unshift({type:'buy',pid:b.pid,evo:b.evo,price:a.price,t:Date.now()});bought.push(p.name)}}
    }
    for(const l of S.listings.filter(x=>!x.dur&&!x.done).sort((x,y)=>x.price-y.price)){
      const c=card(l.uid);if(!c)continue;const p=P(c);const key=p.id+'@'+c.evo;
      let bids=bookAt(p,c.evo,w).bids;bids=takeFrom(bids,w===wNow?S.takenB[key]:null,w);bids=takeFrom(bids,usedB[key]?{w,n:usedB[key]}:null,w);
      const hb=bids.find(x=>x.price>=l.price);
      if(hb){usedB[key]=(usedB[key]||0)+1;inc+=markSold(l,hb.price);sold.push(p.name)}
    }

    if(w===wNow){for(const k in used){const tk=S.taken[k];S.taken[k]={w,n:(tk&&tk.w===w?tk.n:0)+used[k]}}for(const k in usedB){const tk=S.takenB[k];S.takenB[k]={w,n:(tk&&tk.w===w?tk.n:0)+usedB[k]}}}
  }
  if(bought.length||sold.length){S.unseen=(S.unseen||0)+bought.length+sold.length;S.trades=S.trades.slice(0,50);if(bought.length)toast(`구매 완료 · ${bought[0]}${bought.length>1?` 외 ${bought.length-1}장`:''} · 거래 목록에서 선수 받기`);if(sold.length)toast(`판매 완료 · ${sold[0]}${sold.length>1?` 외 ${sold.length-1}장`:''} · 거래 목록에서 GP 받기`);sfx('good');track('trade',bought.length+sold.length);updNav()}
  save();
}

function rollOdds(odds){let r=Math.random(),acc=0;for(const [k,p] of odds){acc+=p;if(r<acc)return k}return odds[odds.length-1][0]}
function drawClass(cls,odds,pos){
  const o=rollOdds(odds);let l=DB.filter(p=>p.cls===cls&&(o==='S'?p.special:(!p.special&&p.ovr===o))&&(!pos||p.pos===pos));
  if(!l.length)l=DB.filter(p=>p.cls===cls&&(!pos||p.pos===pos)&&(o==='S'||!p.special));
  if(!l.length)l=DB.filter(p=>p.cls===cls);
  return pick(l);
}
const DEAL_W={125:30,126:25,127:20,128:13,129:8,130:4};
const dealPool=(pk,pos)=>DB.filter(p=>(p.cls==='lunch'||p.cls==='tots')&&p.ovr>=pk.ovr[0]&&p.ovr<=pk.ovr[1]&&(!pos||p.pos===pos));
function packEvo(pk){if(!pk||pk.evo==null)return 0;if(typeof pk.evo==='number')return pk.evo;return +rollOdds(pk.evo)}
const normalOf=pos=>pick(DB.filter(p=>p.cls==='normal'&&(!pos||p.pos===pos)));
function drawPack(pk,pos){
  if(pk.cls==='deal'){const l=dealPool(pk,pos);const cnt={};l.forEach(p=>cnt[p.ovr]=(cnt[p.ovr]||0)+1);const w=l.map(p=>(DEAL_W[p.ovr]||5)/cnt[p.ovr]);return Array.from({length:pk.n},()=>l[wpick(w)])}
  if(pk.cls==='normal')return Array.from({length:pk.n},()=>normalOf(pos));
  if(pk.cls==='mix'){const a=[normalOf(),normalOf(),normalOf()];a.push(Math.random()<0.85?drawClass('lunch',PK('lunch').odds):drawClass('tots',PK('tots').odds));return a}
  return Array.from({length:pk.n},()=>drawClass(pk.cls,pk.odds,pos));
}
function openPack(pk,free,pos){
  if(!free){if(S.bp<pk.bp)return;S.bp-=pk.bp}
  const got=drawPack(pk,pos).sort((a,b)=>a.ovr-b.ovr);const cs=got.map(p=>addCard(p.id,packEvo(pk)));track('pack');save();renderTop();showReveal(cs,pos?POS_KO[pos]+' 팩':pk.name,pk.col,pk);
}

  for(const [k,l] of a){const r=k==='f'?passFree(l):passPrem(l);(k==='f'?S.pass.cf:S.pass.cp).push(l);if(r.t==='gp')gp+=r.n;else if(r.t==='bp')bp+=r.n;else packs.push(r.id)}
  S.gp+=gp;S.bp+=bp;S.packQ.push(...packs);sfx('good');
  toast(`스타패스 보상 ${a.length}개 받기${gp?` · GP +${fmt(gp)}`:''}${bp?` · BP +${fmt(bp)}`:''}${packs.length?` · 팩 ${packs.length}개`:''}`);
  const id=S.packQ.shift();save();renderTop();if(id)openPack(PK(id),true);else render();
}
function passClaim(v){
  const [k,ls]=v.split(':');const l=+ls;if(l>passLevel())return;
  if(k==='f'){if(S.pass.cf.includes(l))return;S.pass.cf.push(l);grant(passFree(l))}
  else{if(!S.pass.premium||S.pass.cp.includes(l))return;S.pass.cp.push(l);grant(passPrem(l))}
  render();
}

function matchRewards(prep,win,margin,forfeit,myPts){
  if(prep.kind==='friendly'){const out={gp:0,bp:0,xp:0,sp:0,lines:['친선전 · 보상 없음']};const f=S.friends.find(x=>x.id===prep.fid);if(f&&!forfeit){if(win)f.w=(f.w||0)+1;else f.ls=(f.ls||0)+1}
    S.hist.unshift({w:win,a:M.score[0],b:M.score[1],opp:prep.opp.name,mode:'친선전 · '+MODES[prep.mode].n});S.hist=S.hist.slice(0,8);save();return out}
  const mult={chance:1,full:1.25,auto:0.8}[prep.mode]*(prep.kind==='quick'?0.6:1);
  const out={gp:0,bp:0,xp:0,sp:0,lines:[]};if(M&&M.oppLeft)out.lines.push('상대가 나가서 승리 처리');else if(prep.pvp)out.lines.push('vs 플레이어 '+prep.pvp);
  if(!forfeit){out.gp=Math.round(((win?25000:8000)+(win?Math.min(25000,margin*1000):0))*mult/100)*100;out.xp=Math.round((win?120:50)*mult);out.sp=win?60:25}
  S.gp+=out.gp;S.xp+=out.xp;S.pass.sp+=out.sp;
  if(win)S.rec.w++;else S.rec.l++;
  if(!forfeit){track('play');if(win)track('win');if(prep.mode==='chance')track('chance');if(myPts>=30)track('pts')}
  if(prep.kind==='rank'){
    const r=S.rank[prep.mode];
    if(win){r.pts+=3;out.lines.push('랭크 승점 +3')}else{r.pts=Math.max(0,r.pts-1);out.lines.push('랭크 승점 -1')}
    if(win){const b=WIN_BP(r.div);S.bp+=b;out.bp+=b}
    if(r.pts>=DIV_GOAL&&r.div<RANKS.length-1){r.div++;r.pts=0;out.lines.push(`${RANKS[r.div]} 승급!`);const cl=S.rankClaim[prep.mode];if(!cl.includes(r.div)){cl.push(r.div);const ids=[];for(const [id,n] of PROMO[r.div])for(let k=0;k<n;k++)ids.push(id);if(!S.pendingPack)S.pendingPack=ids.shift();S.packQ.push(...ids);out.lines.push('승급 보상 · '+promoText(r.div))}}
    else if(r.div>=RANKS.length-1)r.pts=Math.min(r.pts,DIV_GOAL);
  }
  if(prep.kind==='story'&&win){const st=margin>=20?3:margin>=10?2:1;const s=STORY[prep.stage];const first=!S.story[prep.stage];S.story[prep.stage]=Math.max(S.story[prep.stage]||0,st);out.lines.push(`스테이지 ${prep.stage+1} ${'★'.repeat(st)}`);if(first){for(const r of s.r){if(r.t==='bp'){S.bp+=r.n;out.bp+=r.n}else{S.gp+=r.n;out.gp+=r.n}}out.lines.push('첫 클리어 보상')}}
  if(prep.kind==='challenge'){const c=CHAL.find(x=>x.id===prep.chal);if(c.cond(win,margin)&&!S.chal.done[c.id]){S.chal.done[c.id]=true;out.lines.push(`챌린지 성공 · ${c.name}`);if(c.r.t==='bp'){S.bp+=c.r.n;out.bp+=c.r.n}else{S.pendingPack=c.r.id;out.lines.push(PK(c.r.id).name+' 획득')}}else out.lines.push('챌린지 실패')}
  while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;S.bp+=50;S.gp+=50000;out.bp+=50;out.lines.push(`레벨 ${S.lvl} 달성! BP 50 · GP 50,000`)}
  S.hist.unshift({w:win,a:M.score[0],b:M.score[1],opp:prep.opp.name,mode:MODES[prep.mode].n});S.hist=S.hist.slice(0,8);
  save();
  return out;
}

const SV_PRE='PXHSAVE1.';
const u8e=(u8)=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const u8d=(t)=>{const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function zstream(u8,C){const st=new Blob([u8]).stream().pipeThrough(new C('gzip'));return new Uint8Array(await new Response(st).arrayBuffer())}
async function saveCode(){
  myFid();save();const js=JSON.stringify(S);const raw=new TextEncoder().encode(js);
  try{if(typeof CompressionStream!=='undefined')return SV_PRE+'g.'+u8e(await zstream(raw,CompressionStream))}catch(e){}
  return SV_PRE+'j.'+u8e(raw);
}
async function readSaveCode(t){
  t=(t||'').replace(/\s+/g,'');const i=t.indexOf(SV_PRE);if(i<0)throw 0;t=t.slice(i+SV_PRE.length);
  let u8;if(t.startsWith('g.')){if(typeof DecompressionStream==='undefined')throw 1;u8=await zstream(u8d(t.slice(2)),DecompressionStream)}else if(t.startsWith('j.'))u8=u8d(t.slice(2));else throw 0;
  const txt=new TextDecoder().decode(u8);const o=JSON.parse(txt);if(!o||typeof o!=='object'||!o.name||!Array.isArray(o.cards))throw 0;
  if(!o.fid){try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));o.fid='H'+[...new Uint8Array(h)].slice(0,6).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}}
  return o;
}

  if(a==='rmfanr'){if(R.ct<FAN_CT)return;R.ct-=FAN_CT;const n=pick(RMI_NAMES);fanAdd(n,0,1);save();render();openModal(`<div style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center"><div class="logo">FAN CARD</div><div style="width:120px">${fanHTML(n)}</div><div style="font-size:20px">${esc(n)} 팬카드 획득</div><button class="btn" data-a="close">확인</button></div>`);sfx('walkout');return}

  if(a==='rmswp1'){const c=card(+v);if(!c)return;const lv=rmiLvOf(c);openModal(`<div class="mh"><h3>아이콘 교체</h3><button class="icon-btn" data-a="close">X</button></div><div class="row" style="gap:16px"><div style="width:120px">${cardHTML(c)}</div><div class="grow"><p style="margin:0 0 8px">${esc(P(c).name)} Lv.${lv+1}${c.evo?` · ${c.evo}진`:''}${c.enh?` · +${c.enh}`:''}을(를) 다른 RM 아이콘으로 바꿀까요?</p><p class="muted" style="margin:0">계약권 ${RMI_SWAP}장 사용 · 누가 나올지는 무작위예요.<br>교체되면 <b style="color:var(--pink)">Lv.1 · OVR 120</b>으로 돌아가고 진화·강화도 0이 돼요.</p></div></div><button class="btn gold" data-a="rmswp2" data-v="${c.uid}" ${R.ct>=RMI_SWAP?'':'disabled'}>교체하기 · 계약권 ${RMI_SWAP}</button>`);return}
  if(a==='rmswp2'){const c=card(+v);if(!c||R.ct<RMI_SWAP)return;const old=P(c).name;const w=where(c.uid);const busy=new Set(w&&w.t==='lineup'?S.lineup.filter(u=>u&&u!==c.uid).map(u=>P(card(u)).name):[]);
    const cand=RMI_NAMES.filter(x=>x!==old&&!busy.has(x));if(!cand.length){toast('바꿀 수 있는 선수가 없어요');return}
    R.ct-=RMI_SWAP;const n=pick(cand);c.pid=rmiId(n,0);c.evo=0;c.enh=0;c.ep=0;closeModal();rmiGive(c,`아이콘 교체 · ${old}`);UI.rmsel=n;return}
  if(a==='rmfango'){if(R.tr<FAN_TR)return;R.tr-=FAN_TR;fanAdd(v,0,1);save();closeModal();render();toast(`${v} 팬카드 +1`);sfx('good');return}
}
const rmiCtOf=c=>{const p=P(c);return (p.special?3:1)+(c.evo||0)};
function giftCheck(){
  if(!S.name||S.adminGift||PO||!$('#modal').hidden||S.packQ.length||!S.welcome)return false;

function fanEligible(minE,excl){const out=[];for(const n of RMI_NAMES){const a=rmiS().fan[n]||[];a.forEach((k,e)=>{if(e<minE)return;let c=k;if(excl&&excl[0]===n&&excl[1]===e)c--;if(c>0)out.push([n,e,c])})}return out}
function fanUsed(mats,n,e){return mats.filter(m=>m&&m[0]===n&&m[1]===e).length}
function openFanEvo(n,e){UI.fe={n,e:+e,mats:[null,null,null],pick:null,result:null};drawFanEvo()}
function drawFanEvo(){
  const F=UI.fe;if(!F)return;const R=rmiS();const have=(R.fan[F.n]||[])[F.e]||0;
  if(F.result){const ok=F.result.ok;openModal(`<div style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center"><div class="logo" style="font-size:30px;${ok?'':'color:var(--pink)'}">${ok?'SUCCESS!':'FAIL'}</div><div style="width:120px">${fanHTML(F.n,null,ok?F.e:F.result.from)}</div><div style="font-size:18px">${ok?`팬카드 진화 ${F.result.from} → ${F.e}`:'진화 실패 · 단계는 그대로예요'}</div><div class="muted">확률 ${(F.result.prob*100).toFixed(1)}%</div><button class="btn ghost" data-a="fevoclose">닫기</button></div>`);return}
  if(F.pick!=null){const pool=fanEligible(F.e,[F.n,F.e]).map(([n,e,k])=>[n,e,k-fanUsed(F.mats,n,e)]).filter(x=>x[2]>0);
    openModal(`<div class="mh"><h3>팬카드 재료 선택</h3><button class="icon-btn" data-a="fevoback">&lt;</button></div><p class="muted" style="margin:0">진화 ${F.e}단계 이상인 팬카드만 쓸 수 있어요 · 다른 선수 팬카드도 가능</p><div class="fanrow">${pool.map(([n,e,k])=>`<button data-a="fevopick" data-v="${n}|${e}">${fanHTML(n,k,e)}</button>`).join('')||'<p class="muted">쓸 수 있는 팬카드가 없어요.</p>'}</div>`,true);return}
  if(!have){closeModal();UI.fe=null;render();return}
  const nM=F.mats.filter(Boolean).length;const g=Math.min(10,Math.round(nM*10/3*10)/10);const base=F.e<EVO_MAX?EVO_PROB[F.e]:0;const prob=base*g/10;

    <div class="evwrap"><div class="evtarget"><div style="width:120px">${fanHTML(F.n,have,F.e)}</div><div class="evstep"><b>${F.e}</b><span>▶</span><b class="nx">${Math.min(EVO_MAX,F.e+1)}</b></div></div>
      <div class="evmats"><div class="h" style="margin:0">재료 팬카드 3장 · 진화 ${F.e}단계 이상</div><div class="evslots">${F.mats.map((m,i)=>`<div class="evslot"><button data-a="fevoslot" data-v="${i}">${m?fanHTML(m[0],null,m[1]):'<div class="empty">+</div>'}</button><span class="${m?'ok':''}">${m?esc(m[0]):'팬카드'}</span></div>`).join('')}</div>
        <div class="gauge">${Array.from({length:10},(_,i)=>{const f=clamp(g-i,0,1);return `<i class="${f>=1?'on':f>0?'part':''}" style="--f:${(f*100).toFixed(0)}%"></i>`}).join('')}</div>
        <dl class="pdl"><dt>기본 확률 (${F.e}→${F.e+1})</dt><dd>${Math.round(base*100)}%</dd><dt>게이지</dt><dd>${g.toFixed(1)}/10</dd><dt>최종 확률</dt><dd style="color:var(--lime)">${(prob*100).toFixed(1)}%</dd></dl></div></div>
    <div class="row"><button class="btn ghost" data-a="fevoauto">재료 자동 선택</button><span class="grow"></span><button class="btn" data-a="fevogo" ${g<=0||F.e>=EVO_MAX?'disabled':''}>${g<=0?'재료를 넣어 주세요':'진화하기 · '+(prob*100).toFixed(1)+'%'}</button></div>
    <p class="muted" style="margin:0;font-size:13px">팬카드 1장마다 게이지 3.3칸 · 실패해도 단계가 내려가지 않고, 재료는 사라져요.</p>`,true);
}
function fanEvoAct(a,v){
  const F=UI.fe;if(a==='fevo'){const [n,e]=String(v).split('|');openFanEvo(n,e);return}if(!F)return;
  if(a==='fevoclose'){UI.fe=null;closeModal();render();return}
  if(a==='fevoslot'){F.pick=+v;drawFanEvo();return}
  if(a==='fevoback'){F.pick=null;drawFanEvo();return}
  if(a==='fevopick'){const [n,e]=String(v).split('|');F.mats[F.pick]=[n,+e];F.pick=null;drawFanEvo();return}
  if(a==='fevoauto'){F.mats=[null,null,null];const pool=fanEligible(F.e,[F.n,F.e]).sort((x,y)=>x[1]-y[1]);let i=0;for(const [n,e,k] of pool)for(let j=0;j<k&&i<3;j++)F.mats[i++]=[n,e];if(!i)toast('쓸 수 있는 팬카드가 없어요');drawFanEvo();return}
  if(a==='fevogo'){const nM=F.mats.filter(Boolean).length;if(!nM||F.e>=EVO_MAX)return;const g=Math.min(10,nM*10/3);const prob=EVO_PROB[F.e]*g/10;
    for(const m of F.mats)if(m)fanArr(m[0])[m[1]]--;const ok=Math.random()<prob;const from=F.e;if(ok){fanArr(F.n)[F.e]--;F.e++;fanArr(F.n)[F.e]++}

}

function tone(f,d,type='square',v=0.05,f2=null,delay=0){

    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+0.02)}catch(e){}
}
function sfx(k){
  switch(k){

    case'swish':tone(880,.08);tone(1320,.12,'square',.045,null,.08);break;
    case'rim':tone(180,.12,'triangle',.08,120);break;
    case'steal':tone(300,.08,'sawtooth',.045,600);break;
    case'block':tone(140,.15,'sawtooth',.06,80);break;
    case'buzzer':tone(220,.5,'sawtooth',.05);break;
    case'jump':tone(300,.07,'square',.03,500);break;
    case'perfect':tone(988,.06);tone(1319,.06,'square',.05,null,.06);tone(1976,.1,'square',.05,null,.12);break;
    case'pack':for(let i=0;i<6;i++)tone(200+i*60,.08,'square',.035,null,i*.12);break;
    case'flip':tone(660,.05);break;
    case'good':tone(784,.07);tone(1047,.1,'square',.05,null,.07);break;
    case'walkout':[523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,'square',.05,null,i*.11));break;
    case'chance':tone(440,.08);tone(660,.08,'square',.05,null,.1);tone(880,.15,'square',.05,null,.2);break;
    case'win':[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,null,i*.14));break;
    case'lose':[392,330,262].forEach((f,i)=>tone(f,.2,'triangle',.06,null,i*.18));break;
    case'bounce':tone(120,.04,'triangle',.04);break;
    case'whistle':tone(2600,.09,'square',.035,2400);tone(2600,.22,'square',.035,2350,.12);break;
  }
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clockStr(s){s=Math.max(0,s);const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss}

function addPts(t,i,v){M.score[t]+=v;M.qs[t][Math.min(M.q,5)-1]+=v;M.box[t][i].pts+=v}
function simPoss(t,quiet){
  const O=M.teams[t],D=M.teams[1-t],ob=M.box[t],db=M.box[1-t];
  const avg=(T,k)=>T.players.reduce((a,p)=>a+p.st[k],0)/5;
  const L=(c,s)=>{if(!quiet)logLine(c,s)};
  const to=0.12+(avg(D,'def')-(avg(O,'drb')+avg(O,'pas'))/2)*0.004+(D.tactic.def==='press'?0.035:0);
  if(Math.random()<clamp(to,0.05,0.25)){const i=wpick(D.players.map(p=>p.st.def**2));db[i].stl++;L('',`${D.abbr} ${D.players[i].name} 스틸`);return 0}
  for(let tries=0;tries<3;tries++){
    const i=wpick(O.players.map(p=>Math.pow((p.st.sht+p.st.mid+p.st.ins)/3,2)*(p.pos==='G'?1.1:1)));
    const p=O.players[i],df=D.players[i],tac=O.tactic.off;
    const w=[p.st.sht*(tac==='3pt'?1.5:tac==='inside'?0.6:1),p.st.mid*0.8*(tac==='3pt'?0.8:1),(p.st.ins*0.6+p.st.ath*0.4)*(tac==='inside'?1.4:1)*(D.tactic.def==='zone'?0.75:1)];
    const ty=wpick(w);
    const rating=[p.st.sht,p.st.mid,p.st.ins*0.7+p.st.ath*0.3][ty];
    const pr=clamp([0.36,0.43,0.57][ty]+(rating-df.st.def)*0.006+(ty===0&&D.tactic.def==='zone'?0.03:0),0.1,0.85);
    if(Math.random()<(ty===2?0.13:0.04)+(D.tactic.def==='press'?0.02:0)){
      const n=ty===0?3:2,fp=clamp(0.4+p.st.sht*0.0032+p.st.mid*0.0022,0.45,0.93);const k=wpick(D.players.map((q,j)=>j===i?3:1));db[k].pf++;
      let v=0;for(let f=0;f<n;f++){ob[i].fta++;if(Math.random()<fp){ob[i].ftm++;v++}}
      if(v)addPts(t,i,v);L('',`${D.abbr} ${D.players[k].name} 파울, ${p.name} 자유투 ${v}/${n}`);return v;
    }
    ob[i].fga++;if(ty===0)ob[i].tpa++;
    if(ty===2&&Math.random()<0.05+(df.st.def-70)*0.002){db[i].blk++;L('',`${D.abbr} ${df.name} 블록슛!`)}
    else if(Math.random()<pr){
      const v=ty===0?3:2;addPts(t,i,v);ob[i].fgm++;if(ty===0)ob[i].tpm++;
      let as='';if(Math.random()<0.6){const ww=O.players.map(q=>q.st.pas**2);ww[i]=0;const j=wpick(ww);ob[j].ast++;as=` (어시스트 ${O.players[j].name})`}
      L(ty===0?'hl':'',`${O.abbr} ${p.name} ${['3점슛','중거리슛','골밑 득점'][ty]}${as}`);return v;
    }
    const orb=clamp(0.24+(avg(O,'reb')-avg(D,'reb'))*0.006,0.1,0.4);
    if(Math.random()<orb&&tries<2){const k=wpick(O.players.map(q=>q.st.reb**2));ob[k].reb++;continue}
    const k=wpick(D.players.map(q=>q.st.reb**2*(1+((q.height||175)-175)*0.02)*(1+((q.st.str||70)-70)*0.01)));db[k].reb++;
    L('',`${O.abbr} ${p.name} ${['3점슛','중거리슛','레이업'][ty]} 실패, ${D.abbr} 리바운드`);return 0;
  }
  return 0;
}

function buildPlan(){
  M.plan=[];
  for(let q=1;q<=4;q++){
    const first=q%2===1?0:1;const sl=[];
    for(let k=0;k<8;k++)sl.push({q,k,team:k%2===0?first:1-first,play:false});
    shuffle(sl.filter(s=>s.team===0&&s.k>=1)).slice(0,2).forEach(s=>s.play=true);
    shuffle(sl.filter(s=>s.team===1&&s.k>=1)).slice(0,1).forEach(s=>s.play=true);
    M.plan.push(...sl);
  }
  M.pi=0;M.chanceTotal=M.plan.filter(s=>s.play).length;M.chanceN=0;
}
function nextSlot(){
  if(!M||!M.running||M.mode!=='chance'||M.inChance)return;
  if(M.paused){M.tm=setTimeout(nextSlot,250);return}
  if(M.pi>=M.plan.length){
    if(M.score[0]===M.score[1]){const q=Math.max(5,M.q+1);for(let k=0;k<4;k++)M.plan.push({q,k,team:k%2,play:k===1||k===2,ot:true});M.chanceTotal+=2}
    else{finishMatch(false);return}
  }
  const s=M.plan[M.pi];
  if(s.q!==M.q){M.q=s.q;M.clockTxt=s.q>4?'0:30':'1:00';logLine('sep',`— ${s.q>4?'연장전':s.q+'쿼터'} —`);sfx('buzzer')}
  M.clockTxt=clockStr(s.q>4?30-s.k*7:60-Math.round(s.k*7.5));
  if(s.play){M.curSlot=s;M.chanceN++;sfx('chance');
    const atk=s.team===0;
    showMsg(`<div class="big">${atk?'공격 찬스!':'수비 찬스!'}</div><div>${atk?'공을 잡고 득점을 노려요. 14초 안에 슛!':'상대 공격을 막아내요. 스틸·블록·리바운드로 끝내기'}</div><div class="muted">찬스 ${M.chanceN} / ${M.chanceTotal}</div><div class="row" style="justify-content:center"><button class="btn" data-a="chplay">직접 플레이 ▶</button><button class="btn ghost sm" data-a="chauto">자동 진행</button></div>`);
    return}
  simPoss(s.team);M.pi++;
  M.tm=setTimeout(nextSlot,260);
}

function nextQuarter(){
  if(!M||M.done||!G||!G.qOver)return;
  hideMsg();M.q++;liveEv('qstart');G.clock=M.q>4?M.qlen/2:M.qlen;G.qOver=false;G.qDone=false;G.fx=[];placeAll(M.q%2===1?0:1,'back');resetInput();
}
function skipSim(){
  if(!M||M.done||!G)return;
  let left=Math.max(0,G.clock),t=G.poss;
  const total=left+Math.max(0,4-M.q)*M.qlen;let n=Math.round(total/11);
  G=null;
  let qLeft=left;
  for(let i=0;i<n;i++){simPoss(t,true);t=1-t;qLeft-=11;if(qLeft<=0&&M.q<4){M.q++;qLeft+=M.qlen}}
  if(M.q<4)M.q=4;
  while(M.score[0]===M.score[1]){M.q=Math.max(5,M.q+1);for(let i=0;i<6;i++){simPoss(t,true);t=1-t}}
  finishMatch(false);
}

    case'screen':if(Math.random()<0.6)callOut('screen');break;
    case'dbl':callOut('dbl');break;
    case'qstart':say(line(M.q>4?'ot':'q'+M.q),3);cheer(0.4,true);break;
    case'qend':{const a=M.score[0],b=M.score[1];const L=a===b?`All tied up at ${a}.`:`${tnm(a>b?0:1)} leads, ${Math.max(a,b)} to ${Math.min(a,b)}.`;cheer(0.7,true);say(M.q>4?`End of overtime. ${L}`:line('qend',{Q:QN[M.q]||'',L}),4);break}
    case'final':{const a=M.score[0],b=M.score[1];cheer(o.win?1.6:0.5,!!o.win);say(line('final',{W:tnm(a>=b?0:1),a:Math.max(a,b),b:Math.min(a,b)}),5);setTimeout(ambStop,2500);break}
  }
}
function liveFx(text){
  switch(text){
    case'+3':cheer(1.2,true);say('Bang! From downtown!',3);break;
    case'+2':cheer(0.8,true);say(['Good!','Puts it in!','Two points!'][Math.floor(Math.random()*3)],3);break;
    case'DUNK!':cheer(1.4,true);say('Slam dunk!',3);break;
    case'BLOCK!':cheer(0.9,true);say('Rejected!',3);break;
    case'STEAL!':case'STRIP!':cheer(0.6,true);say('Steal!',3);break;
    case'AIR BALL':ooh(0.6,true);say('Air ball!',2);break;
    case'FT +1':cheer(0.4,true);break;
    case'FT MISS':ooh(0.5,true);break;
  }
}
function liveFrame(dt){
  if(!G||!M||M.paused||!AC)return;
  LIVE.sq-=dt;LIVE.snapT+=dt;
  if(LIVE.snapT>=0.15){
    const w=LIVE.snapT;LIVE.snapT=0;
    for(const p of G.P){
      const vx=p._lx!=null?(p.x-p._lx)/w:0,vy=p._ly!=null?(p.y-p._ly)/w:0;const sp=Math.hypot(vx,vy);
      if(p._lv){const [ax,ay,as]=p._lv;const turn=as>4.5&&sp>1.5&&(ax*vx+ay*vy)/(as*sp)<0.25,stop=as>6&&sp<1.2;
        if((turn||stop)&&LIVE.sq<=0&&Math.random()<0.55){squeak();LIVE.sq=0.12+Math.random()*0.25}}
      p._lx=p.x;p._ly=p.y;p._lv=[vx,vy,sp];
    }
  }
  const b=G.ball,o=b&&b.state==='held'?b.owner:null;
  if(o&&!o.gather&&!(G.dead>0)){LIVE.dr-=dt;if(LIVE.dr<=0){thump();const sp=o._lv?o._lv[2]:0;LIVE.dr=sp>6?0.3:sp>2?0.38:0.48}}else LIVE.dr=0.15;
  LIVE.callT-=dt;
  if(LIVE.callT<=0){LIVE.callT=4+Math.random()*5;if(o&&!(G.dead>0)&&performance.now()-LIVE.lastSay>1500)callOut(Math.random()<0.55?'off':'def')}
  const late=G.kind==='full'&&M.q>=4&&G.clock<20&&Math.abs(M.score[0]-M.score[1])<=6;
  ambLevel(late?0.16:0.09);
}
